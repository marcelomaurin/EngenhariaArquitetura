name: Apps CI
on:
  push:
    branches: [fila]
    paths:
      - 'launcher/**'
      - 'cad2d/**'
      - '.github/workflows/apps-ci.yml'
  workflow_dispatch:
jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Lazarus GTK2
        run: |
          sudo apt-get update
          sudo apt-get install -y lazarus libgtk2.0-dev pkg-config xvfb xauth
      - name: Compilar launcher
        run: lazbuild -B --ws=gtk2 launcher/src/app/engenhariaarquitetura.lpi
      - name: Compilar CAD 2D
        run: lazbuild -B --ws=gtk2 cad2d/src/app/cad2d.lpi
      - name: Conferir executáveis
        run: test -x bin/engenhariaarquitetura && test -x bin/cad2d
